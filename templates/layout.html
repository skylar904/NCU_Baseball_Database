<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中大棒球資料庫</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    
    <style>
        body { 
            padding-top: 20px; 
            padding-bottom: 40px; 
            background-color: #f8f9fa;
        }
        
        /* 自訂導覽列樣式 */
        .navbar-custom {
            background: linear-gradient(90deg, #0d47a1 0%, #1565c0 100%); /* 深藍色漸層 */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 15px 0;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .navbar-brand:hover {
            color: #ffca28 !important;
            transform: scale(1.02);
            transition: all 0.3s;
        }
        
        .footer-text {
            text-align: center;
            margin-top: 50px;
            color: #6c757d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="container">

    <nav class="navbar navbar-expand-lg navbar-custom navbar-dark mb-4 rounded-3 px-3 d-flex justify-content-between align-items-center">
        
        <a class="navbar-brand" href="/">
            <i class="bi bi-trophy-fill me-2"></i>
            中大棒球
        </a>

        <div>
            <a href="/" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="bi bi-house-door-fill me-1"></i> 回首頁
            </a>
        </div>
    </nav>

    <div class="bg-white p-4 rounded-3 shadow-sm" style="min-height: 500px;">
        {% block content %}{% endblock %}
    </div>

    <div class="footer-text">
        <p>&copy; 2025 NCU Baseball Database. All Rights Reserved.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
